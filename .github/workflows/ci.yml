name: ci

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: brew install ninja cmake
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPITCHDELAY_INSTALL_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Install pluginval
        run: |
          curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
      - name: Validate plugins
        env:
          PLUGINVAL: ${{ github.workspace }}/pluginval.app/Contents/MacOS/pluginval
          CI: "true"
        run: scripts/validate.sh build

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libxi-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPITCHDELAY_INSTALL_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: xvfb-run -a ctest --test-dir build --output-on-failure
      - name: Install pluginval
        run: |
          curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          chmod +x pluginval
      - name: Validate the VST3
        run: xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process --skip-gui-tests build/PitchDelay_artefacts/Release/VST3/PitchDelay.vst3

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -A x64 -DPITCHDELAY_INSTALL_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install pluginval
        run: |
          curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          7z x -y pluginval.zip > /dev/null
      - name: Validate the VST3
        run: ./pluginval.exe --strictness-level 10 --validate-in-process --skip-gui-tests build/PitchDelay_artefacts/Release/VST3/PitchDelay.vst3
